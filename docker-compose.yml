# docker-compose.yml — Cantina Tita v1
#
# Arquitectura:
#   frontend    → Nginx (React SPA + proxy inverso)   puerto 80
#   backend     → Django + Daphne ASGI                interno
#   postgres    → PostgreSQL 16                        interno
#   redis       → Para Django Channels + Celery        interno
#   celery      → Worker de tareas async               (comparte imagen con backend)
#   celery-beat → Scheduler de tareas periódicas       (comparte imagen con backend)
#   prometheus  → Métricas                             127.0.0.1:9090
#   grafana     → Dashboards                           127.0.0.1:3000
#   pushgateway → Métricas Celery                      127.0.0.1:9091
#   waha        → WhatsApp self-hosted                 127.0.0.1:3001
#
# Cloudflare Tunnel corre como servicio nativo de Windows (no en Docker).
#
# Primer uso:
#   1. Copiar .env.production.example → backend/.env.production y rellenar
#   2. docker compose build
#   3. docker compose run --rm backend python manage.py migrate
#   4. docker compose up -d
#   5. Verificar: curl http://localhost/api/health/

services:

  # ── Frontend (Nginx + React build) ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SENTRY_DSN: "${VITE_SENTRY_DSN:-}"
        VITE_GIT_COMMIT_SHA: "${GIT_COMMIT_SHA:-}"
    volumes:
      - backend_static:/app/staticfiles:ro
    ports:
      - "80:80"
    mem_limit: 128m
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cantina_net

  # ── Backend (Django + Daphne ASGI) ─────────────────────────────────────────
  # celery y celery-beat reusan esta misma imagen (image: tita2026-backend)
  # para evitar rebuilds duplicados desde el mismo Dockerfile.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: tita2026-backend
    environment:
      DJANGO_SETTINGS_MODULE: backend.settings.production
      DB_HOST: postgres
      DB_PORT: "5432"
    env_file:
      - ./backend/.env.production
    volumes:
      - backend_media:/app/media
      - backend_static:/app/staticfiles
      - backend_logs:/app/logs
    expose:
      - "8000"
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client; c=http.client.HTTPConnection('localhost',8000); c.request('GET','/api/health/ready/'); r=c.getresponse(); exit(0 if r.status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - cantina_net

  # ── PostgreSQL 16 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cantina_tita
      POSTGRES_USER: app_cantina
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Configurar DB_PASSWORD en .env.production}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_cantina -d cantina_tita"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - cantina_net

  # ── Redis (Channels + Celery broker) ───────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    mem_limit: 256m
    restart: unless-stopped
    networks:
      - cantina_net

  # ── Celery Worker ───────────────────────────────────────────────────────────
  celery:
    image: tita2026-backend
    command: celery -A backend.celery_app worker -l INFO --concurrency=${CELERY_CONCURRENCY:-4}
    environment:
      DJANGO_SETTINGS_MODULE: backend.settings.production
      DB_HOST: postgres
      DB_PORT: "5432"
    env_file:
      - ./backend/.env.production
    volumes:
      - backend_media:/app/media
      - backend_logs:/app/logs
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cantina_net

  # ── Celery Beat (scheduler de tareas periódicas) ────────────────────────────
  celery-beat:
    image: tita2026-backend
    command: celery -A backend.celery_app beat -l INFO -s /app/beatdata/celerybeat-schedule
    environment:
      DJANGO_SETTINGS_MODULE: backend.settings.production
      DB_HOST: postgres
      DB_PORT: "5432"
    env_file:
      - ./backend/.env.production
    volumes:
      - backend_logs:/app/logs
      - celerybeat_data:/app/beatdata
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cantina_net

  # ── Prometheus ──────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.4.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"
    mem_limit: 256m
    restart: unless-stopped
    networks:
      - cantina_net

  # ── Prometheus PushGateway (métricas Celery) ───────────────────────────────
  pushgateway:
    image: prom/pushgateway:v1.10.0
    ports:
      - "127.0.0.1:9091:9091"
    mem_limit: 64m
    restart: unless-stopped
    networks:
      - cantina_net

  # ── Redis Exporter (métricas Prometheus de Redis) ───────────────────────────
  redis_exporter:
    image: oliver006/redis_exporter:v1.67.0
    environment:
      REDIS_ADDR: redis://redis:6379
    expose:
      - "9121"
    mem_limit: 64m
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - cantina_net

  # ── WAHA (WhatsApp self-hosted) ─────────────────────────────────────────────
  waha:
    image: devlikeapro/waha:latest-2026.6.2
    environment:
      WHATSAPP_API_KEY: "${WAHA_API_KEY:-}"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - waha_data:/app/.sessions
    mem_limit: 1g
    restart: unless-stopped
    networks:
      - cantina_net

  # ── Grafana ─────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.6.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:?Configurar GRAFANA_PASSWORD en el archivo .env}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/cantina.json
      GF_ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@cantinatita.com}"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 256m
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - cantina_net

networks:
  cantina_net:
    driver: bridge

volumes:
  postgres_data:
  backend_media:
  backend_static:
  backend_logs:
  celerybeat_data:
  waha_data:
  redis_data:
  prometheus_data:
  grafana_data:
