# ====================================
# Pytest Configuration
# Comprehensive testing configuration for Cantina Tita
# ====================================

[pytest]
DJANGO_SETTINGS_MODULE = backend.settings.test
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*

# Test discovery patterns
testpaths = apps tests

# Additional options
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --maxfail=10
    --durations=10
    --cov-config=.coveragerc
    --no-migrations
    --reuse-db

# Markers for categorizing tests
markers =
    unit: Unit tests
    integration: Integration tests
    api: API tests
    slow: Slow-running tests (use -m "not slow" to skip)
    security: Security tests
    performance: Performance tests
    database: Database-related tests
    redis: Redis-related tests
    celery: Celery task tests
    emails: Email-related tests
    auth: Authentication tests
    permissions: Permission tests
    admin: Django admin tests
    models: Model tests
    views: View tests
    serializers: Serializer tests
    utils: Utility tests
    smoke: Smoke tests
    regression: Regression tests

# Ignore warnings from dependencies
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:django.utils.translation*
    ignore::UserWarning:rest_framework*

# Set minimum version
minversion = 7.0

# Test session timeout
timeout = 300
