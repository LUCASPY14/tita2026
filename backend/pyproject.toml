[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
# E402 es intencional en views.py donde helpers se definen antes de imports locales
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
# Migrations solo generan imports para dependencias
"apps/*/migrations/*.py" = ["F401", "E501"]
# Tests: fixtures creados por efecto secundario (F841), firmas largas (E501), redefinición de imports (F811)
"apps/*/tests/*.py" = ["F811", "F841", "E501"]
# conftest fixtures se usan vía inyección
"conftest.py" = ["F401", "F811"]
# Management commands: strings descriptivos pueden ser largos
"apps/*/management/commands/*.py" = ["E501"]
