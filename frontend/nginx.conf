# Nginx config para el contenedor frontend de Cantina Tita.
# Sirve el build de Vite y hace proxy al backend Django/Daphne.

upstream backend {
    server backend:8000;
    keepalive 32;
}

# ── Rate limiting ─────────────────────────────────────────────────────────────
# Zona para el endpoint de login (auth) — muy restrictivo: 5 req/min por IP
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/m;

# Zona para el portal de padres (internet) — 30 req/min por IP
limit_req_zone $binary_remote_addr zone=portal_zone:10m rate=30r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip para assets estáticos
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── Security headers ──────────────────────────────────────────────────────
    # CSP: solo recursos propios; unsafe-inline en style requerido por Tailwind 4
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss://cantinatita.com https://cantinatita.com https://vpos.infonet.com.py; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://vpos.infonet.com.py;"
        always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
    add_header X-Frame-Options          "DENY" always;
    add_header X-Content-Type-Options   "nosniff" always;

    # Service Worker — siempre sin cache (el browser verifica actualizaciones)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    # PWA Manifest — sin cache + MIME type correcto
    location ~* \.webmanifest$ {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Assets con hash de contenido: cache de 1 año
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API REST → backend Django
    location /api/ {
        proxy_pass         http://backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        client_max_body_size 10m;
    }

    # Login / 2FA / recuperación — rate limit estricto: 5 req/min, burst 3
    location ~* ^/api/v1/(auth|usuarios/login|usuarios/2fa) {
        limit_req zone=login_zone burst=3 nodelay;
        limit_req_status 429;

        proxy_pass         http://backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Portal de padres — rate limit moderado: 30 req/min, burst 10
    location /api/v1/portal/ {
        limit_req zone=portal_zone burst=10 nodelay;
        limit_req_status 429;

        proxy_pass         http://backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Admin Django
    location /admin/ {
        proxy_pass         http://backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 10m;
    }

    # WebSocket (Channels/Daphne)
    location /ws/ {
        proxy_pass             http://backend;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_read_timeout     14400s;
        proxy_send_timeout     14400s;
    }

    # Archivos estáticos de Django (admin, DRF browsable, swagger)
    # ^~ garantiza que este prefix gane sobre el regex ~* \.(css|js|...) más abajo
    location ^~ /static/ {
        alias /app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        gzip_static on;
    }

    # Archivos de media (fotos de alumnos, etc.)
    # ^~ por la misma razón: evita que el regex de assets intercepte .jpg, .png, etc.
    location ^~ /media/ {
        proxy_pass http://backend;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Prometheus metrics — solo accesible desde la red interna Docker
    location /metrics {
        proxy_pass         http://backend;
        proxy_set_header   Host $host;
        allow 172.16.0.0/12;   # rango Docker bridge
        allow 10.0.0.0/8;
        deny  all;
    }

    # React SPA: cualquier otra ruta devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
