# Nginx config para el contenedor frontend de Cantina Tita.
# Sirve el build de Vite y hace proxy al backend Django/Daphne.

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip para assets estáticos
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets con hash de contenido: cache de 1 año
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API REST → backend Django
    location /api/ {
        proxy_pass         http://backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        client_max_body_size 10m;
    }

    # Admin Django
    location /admin/ {
        proxy_pass         http://backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    # WebSocket (Channels/Daphne)
    location /ws/ {
        proxy_pass             http://backend;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_read_timeout     86400s;
    }

    # Archivos estáticos de Django (admin, DRF browsable, swagger)
    location /static/ {
        proxy_pass http://backend;
        expires 1d;
        add_header Cache-Control "public";
    }

    # Archivos de media (fotos de alumnos, etc.)
    location /media/ {
        proxy_pass http://backend;
        expires 7d;
        add_header Cache-Control "public";
    }

    # React SPA: cualquier otra ruta devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
