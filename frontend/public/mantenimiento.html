<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mantenimiento — Cantina Tita</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f8fafc;
    color: #1e293b;
  }
  .card {
    max-width: 420px;
    width: 100%;
    text-align: center;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 20px;
    padding: 36px 28px;
    box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
  }
  .icon {
    font-size: 40px;
    margin-bottom: 8px;
  }
  h1 {
    font-size: 20px;
    margin: 12px 0 8px;
  }
  p {
    font-size: 15px;
    line-height: 1.5;
    color: #475569;
    margin: 0;
  }
  .footer {
    margin-top: 20px;
    font-size: 13px;
    color: #94a3b8;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🛠️</div>
    <h1>Estamos actualizando el sistema</h1>
    <p>La Cantina de Tita está en mantenimiento por unos minutos. Volvé a intentar en breve.</p>
    <div class="footer">Esta página se actualiza sola — no hace falta recargar.</div>
  </div>
  <script src="/mantenimiento.js"></script>
</body>
</html>
