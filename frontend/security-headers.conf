# Snippet con las cabeceras de seguridad del bloque `server` de nginx.conf.
# nginx NO hereda add_header de un nivel padre en ningún location que defina
# su propio add_header (p.ej. Cache-Control) — por eso cada location con
# Cache-Control propio necesita `include` este archivo explícitamente.
add_header Content-Security-Policy
    "default-src 'self'; script-src 'self' https://vpos.infonet.com.py https://vpos.infonet.com.py:8888; style-src 'self' 'unsafe-inline' https://vpos.infonet.com.py https://vpos.infonet.com.py:8888; img-src 'self' data: blob: https://vpos.infonet.com.py https://vpos.infonet.com.py:8888; font-src 'self' https://vpos.infonet.com.py https://vpos.infonet.com.py:8888; connect-src 'self' wss://cantinatita.com https://cantinatita.com https://vpos.infonet.com.py https://vpos.infonet.com.py:8888; frame-src https://vpos.infonet.com.py https://vpos.infonet.com.py:8888 https://www.youtube-nocookie.com https://www.youtube.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://vpos.infonet.com.py https://vpos.infonet.com.py:8888;"
    always;
add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
add_header X-Frame-Options          "DENY" always;
add_header X-Content-Type-Options   "nosniff" always;
