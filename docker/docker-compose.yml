version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: cantina_db
      POSTGRES_USER: cantina_user
      POSTGRES_PASSWORD: cantina_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - cantina-network

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://cantina_user:cantina_pass@db:5432/cantina_db
      - SECRET_KEY=dev-secret-key-change-in-production
    depends_on:
      - db
    networks:
      - cantina-network

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    networks:
      - cantina-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./frontend/dist:/usr/share/nginx/html
    depends_on:
      - backend
      - frontend
    networks:
      - cantina-network

volumes:
  postgres_data:

networks:
  cantina-network:
    driver: bridge
