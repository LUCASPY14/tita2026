services:
  db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ChangeThis_StrongPassw0rd!
    volumes:
      - mssql_data:/var/opt/mssql
    ports:
      - "1433:1433"
    networks:
      - cantina-network

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DB_ENGINE=mssql
      - DB_NAME=titadb
      - DB_USER=sa
      - DB_PASSWORD=ChangeThis_StrongPassw0rd!
      - DB_HOST=db
      - DB_PORT=1433
      - SECRET_KEY=dev-secret-key-change-in-production
    depends_on:
      - db
    networks:
      - cantina-network

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    networks:
      - cantina-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./frontend/dist:/usr/share/nginx/html
    depends_on:
      - backend
      - frontend
    networks:
      - cantina-network

volumes:
  mssql_data:

networks:
  cantina-network:
    driver: bridge
