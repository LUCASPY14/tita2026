# Pre-commit Hooks Configuration
# https://pre-commit.com/

default_install_hook_types: [pre-commit, commit-msg]
default_language_version:
  python: python3.11
  node: 18.0.0

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
        exclude: '\.txt$'
      - id: check-yaml
        args: ['--unsafe']
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Python - Black (formatting)
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        name: Format Python code with Black
        language_version: python3.11
        args: ['--line-length=120']
        exclude: '^(migrations|node_modules)/'

  # Python - isort (import sorting)
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: Sort Python imports with isort
        args: ['--profile=black', '--line-length=120']
        exclude: '^(migrations|node_modules)/'

  # Python - Flake8 (linting)
  - repo: https://github.com/PyCQA/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        name: Lint Python with Flake8
        args: [
          '--max-line-length=120',
          '--extend-ignore=E203,E266,E501,W503',
          '--exclude=migrations,__pycache__,node_modules,.venv,venv',
          '--max-complexity=15'
        ]

  # Python - Bandit (security)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        name: Check Python security with Bandit
        args: ['-ll', '--skip=B101,B601']
        exclude: '^(tests?/|migrations/)'

  # Python - Django checks
  - repo: local
    hooks:
      - id: django-check
        name: Django system check
        entry: bash -c 'cd backend && python manage.py check --deploy --settings=backend.settings.production'
        language: system
        pass_filenames: false
        files: '\.py$'
        stages: [push]

  # JavaScript/TypeScript - ESLint
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.0.0-beta.2
    hooks:
      - id: eslint
        name: Lint JavaScript/TypeScript
        files: \.(js|jsx|ts|tsx)$
        types: [file]
        args: ['--fix', '--max-warnings=0']
        additional_dependencies:
          - eslint@8.57.0
          - '@typescript-eslint/parser@7.0.0'
          - '@typescript-eslint/eslint-plugin@7.0.0'
          - eslint-plugin-react@7.34.0
          - eslint-plugin-react-hooks@4.6.0

  # JavaScript/TypeScript - Prettier
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        name: Format JS/TS/JSON/CSS with Prettier
        types_or: [javascript, jsx, ts, tsx, json, css, scss, markdown]
        args: ['--write', '--ignore-unknown']
        additional_dependencies:
          - prettier@3.2.5

  # Commit message validation
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.20.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

# Configuration for specific tools
exclude: |
  (?x)^(
      migrations/.*|
      node_modules/.*|
      \.venv/.*|
      venv/.*|
      \.pytest_cache/.*|
      __pycache__/.*|
      \.git/.*|
      temp_logs/.*|
      logs/.*|
      .*\.log|
      .*\.txt|
      dist/.*|
      build/.*
  )$
