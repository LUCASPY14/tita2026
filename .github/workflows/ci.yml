name: CI Pipeline - Cantina Tita
on:
  push:
    branches: [desarrollo, main]
  pull_request:
    branches: [desarrollo, main]

jobs:
  backend-tests:
    name: Backend Tests (Django)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage
      
      - name: Run tests with coverage
        env:
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: True
          DATABASE_URL: sqlite:///test_db.sqlite3
        run: |
          cd backend
          coverage run --source='apps' manage.py test apps --keepdb
          coverage report
          coverage xml
          coverage html
      
      - name: Upload coverage report
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
      
      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v3
        with:
          name: backend-coverage-report
          path: backend/htmlcov/

  frontend-tests:
    name: Frontend Tests (React)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Run tests with coverage
        run: |
          cd frontend
          npm test -- --watchAll=false --coverage --passWithNoTests
      
      - name: Upload coverage report
        uses: codecov/codecov-action@v3
        with:
          file: ./frontend/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage
      
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v3
        with:
          name: frontend-coverage-report
          path: frontend/coverage/

  backend-linting:
    name: Backend Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 isort
      
      - name: Check code formatting with Black
        run: |
          cd backend
          black --check apps/ || echo "WARNING: Código no formateado correctamente"
      
      - name: Run Flake8 linter
        run: |
          cd backend
          flake8 apps/ --max-line-length=100 --extend-ignore=E203,W503 || echo "WARNING: Problemas de linting encontrados"
      
      - name: Check import sorting with isort
        run: |
          cd backend
          isort --check-only apps/ || echo "WARNING: Imports no ordenados correctamente"

  frontend-linting:
    name: Frontend Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Run ESLint
        run: |
          cd frontend
          npm run lint || echo "WARNING: Problemas de linting encontrados"
      
      - name: Type check with TypeScript
        run: |
          cd frontend
          npm run type-check || npx tsc --noEmit || echo "WARNING: Errores de tipos encontrados"

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: [backend-tests, backend-linting]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Collect static files
        env:
          SECRET_KEY: build-secret-key
          DEBUG: False
        run: |
          cd backend
          python manage.py collectstatic --noinput || echo "✓ Static files collected"

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [frontend-tests, frontend-linting]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Build production bundle
        run: |
          cd frontend
          npm run build
      
      - name: Check bundle size
        run: |
          cd frontend
          du -sh build/
          echo "Bundle size:"
          find build/ -type f -name "*.js" -exec du -h {} \;
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with:
          name: frontend-build
          path: frontend/build/

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, backend-linting, frontend-linting, build-backend, build-frontend]
    if: always()
    
    steps:
      - name: Summary
        run: |
          echo "SUCCESS: CI Pipeline completado"
          echo "Backend Tests: ${{ needs.backend-tests.result }}"
          echo "Frontend Tests: ${{ needs.frontend-tests.result }}"
          echo "Backend Linting: ${{ needs.backend-linting.result }}"
          echo "Frontend Linting: ${{ needs.frontend-linting.result }}"
          echo "Backend Build: ${{ needs.build-backend.result }}"
          echo "Frontend Build: ${{ needs.build-frontend.result }}"
