# ====================================
# Comprehensive Test Pipeline Configuration
# Automated testing for CI/CD with multiple test types
# ====================================

name: Comprehensive Test Suite

on:
  workflow_call:
    inputs:
      environment:
        required: false
        type: string
        default: 'test'
      test_type:
        required: false
        type: string
        default: 'all'
      coverage_threshold:
        required: false
        type: number
        default: 95

env:
  PYTHONPATH: ${{ github.workspace }}/backend
  NODE_OPTIONS: --max_old_space_size=4096

jobs:
  # ================================
  # UNIT TESTS
  # ================================
  unit-tests-backend:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
        django-version: ['4.2', '5.0']
        
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_cantina
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt
      
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install "Django~=${{ matrix.django-version }}.0"
      
      - name: Run unit tests
        env:
          SECRET_KEY: test-secret-${{ github.run_id }}
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_cantina
          REDIS_URL: redis://localhost:6379/1
          DJANGO_SETTINGS_MODULE: backend.settings.test
        run: |
          cd backend
          
          # Run unit tests with coverage
          pytest \
            --cov=apps \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --cov-fail-under=${{ inputs.coverage_threshold }} \
            --junit-xml=junit.xml \
            --maxfail=5 \
            -v \
            apps/*/tests.py \
            apps/*/test_*.py
      
      - name: Upload unit test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: unit-test-results-py${{ matrix.python-version }}-django${{ matrix.django-version }}
          path: |
            backend/coverage.xml
            backend/htmlcov/
            backend/junit.xml
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          flags: unit-tests,python-${{ matrix.python-version }}
          name: unit-coverage

  unit-tests-frontend:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: ['18', '20']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Run unit tests
        run: |
          cd frontend
          npm test -- \
            --coverage \
            --watchAll=false \
            --testResultsProcessor=jest-junit \
            --coverageReporters=text \
            --coverageReporters=lcov \
            --coverageReporters=html
        env:
          JEST_JUNIT_OUTPUT_DIR: ./test-results
          JEST_JUNIT_OUTPUT_NAME: junit.xml
      
      - name: Upload frontend test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: frontend-unit-tests-node${{ matrix.node-version }}
          path: |
            frontend/coverage/
            frontend/test-results/

  # ================================
  # INTEGRATION TESTS
  # ================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests-backend]
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: integration_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
      
      - name: Run integration tests
        env:
          SECRET_KEY: integration-test-${{ github.run_id }}
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/integration_test
          REDIS_URL: redis://localhost:6379/2
          DJANGO_SETTINGS_MODULE: backend.settings.test
        run: |
          cd backend
          
          # Run integration tests
          pytest \
            tests/integration/ \
            --cov=apps \
            --cov-report=xml \
            --junit-xml=integration-junit.xml \
            -v \
            --tb=short
      
      - name: Upload integration test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: integration-test-results
          path: |
            backend/coverage.xml
            backend/integration-junit.xml

  # ================================
  # API TESTS
  # ================================
  api-tests:
    name: API Contract Tests
    runs-on: ubuntu-latest
    needs: [unit-tests-backend]
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: api_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest-api pytest-httpx
      
      - name: Start Django server
        env:
          SECRET_KEY: api-test-${{ github.run_id }}
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/api_test
          DJANGO_SETTINGS_MODULE: backend.settings.test
        run: |
          cd backend
          python manage.py migrate
          python manage.py collectstatic --noinput
          python manage.py runserver 127.0.0.1:8000 &
          sleep 10
      
      - name: Run API contract tests
        run: |
          cd backend
          pytest \
            tests/api/ \
            --base-url=http://127.0.0.1:8000 \
            --junit-xml=api-junit.xml \
            -v
      
      - name: Upload API test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: api-test-results
          path: backend/api-junit.xml

  # ================================
  # DATABASE TESTS
  # ================================
  database-tests:
    name: Database Migration & Performance Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        db_version: ['postgres:13', 'postgres:14', 'postgres:15']
    
    services:
      postgres:
        image: ${{ matrix.db_version }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: db_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install django-migration-testcase
      
      - name: Test migrations
        env:
          SECRET_KEY: migration-test-${{ github.run_id }}
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/db_test
          DJANGO_SETTINGS_MODULE: backend.settings.test
        run: |
          cd backend
          
          # Test forward migrations
          python manage.py migrate
          
          # Test backward migrations (rollback)
          python manage.py migrate apps.usuarios zero
          python manage.py migrate
          
          # Test migration performance
          python -c "
          import time
          import django
          django.setup()
          from django.core.management import call_command
          
          start = time.time()
          call_command('migrate', verbosity=0)
          duration = time.time() - start
          print(f'Migration time: {duration:.2f}s')
          
          if duration > 30:  # 30 second threshold
              raise Exception(f'Migration too slow: {duration:.2f}s')
          "
      
      - name: Run database performance tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/db_test
          DJANGO_SETTINGS_MODULE: backend.settings.test
        run: |
          cd backend
          pytest tests/database/ -v --tb=short

  # ================================
  # SECURITY TESTS
  # ================================
  security-tests:
    name: Security & Vulnerability Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install security testing tools
        run: |
          cd backend
          pip install -r requirements.txt
          pip install bandit safety semgrep
      
      - name: Run Bandit security scan
        run: |
          cd backend
          bandit -r apps/ -f json -o bandit-report.json || true
      
      - name: Run Safety check
        run: |
          cd backend
          safety check --json --output safety-report.json || true
      
      - name: Run Semgrep security scan
        run: |
          cd backend
          semgrep --config=auto apps/ --json --output=semgrep-report.json || true
      
      - name: Django security check
        env:
          SECRET_KEY: security-test-${{ github.run_id }}
          DJANGO_SETTINGS_MODULE: backend.settings.production
        run: |
          cd backend
          python manage.py check --deploy --fail-level WARNING
      
      - name: Upload security reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-reports
          path: |
            backend/bandit-report.json
            backend/safety-report.json
            backend/semgrep-report.json

  # ================================
  # LOAD TESTS
  # ================================
  load-tests:
    name: Performance Load Tests
    runs-on: ubuntu-latest
    if: ${{ inputs.test_type == 'all' || inputs.test_type == 'performance' }}
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: load_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install locust
      
      - name: Setup test environment
        env:
          SECRET_KEY: load-test-${{ github.run_id }}
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/load_test
          DJANGO_SETTINGS_MODULE: backend.settings.test
        run: |
          cd backend
          python manage.py migrate
          python manage.py loaddata fixtures/test_data.json || true
          python manage.py runserver &
          sleep 10
      
      - name: Run load tests
        run: |
          cd performance_tests
          locust \
            --headless \
            --users 50 \
            --spawn-rate 5 \
            --host http://localhost:8000 \
            --run-time 120s \
            --html load_test_report.html \
            --csv load_test_results
      
      - name: Upload load test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: load-test-results
          path: performance_tests/load_test*

  # ================================
  # TEST SUMMARY
  # ================================
  test-summary:
    name: Test Results Summary
    runs-on: ubuntu-latest
    needs: [
      unit-tests-backend,
      unit-tests-frontend,
      integration-tests,
      api-tests,
      database-tests,
      security-tests
    ]
    if: always()
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3
      
      - name: Generate test summary
        run: |
          echo "## 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status | Coverage |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests (Backend) | ${{ needs.unit-tests-backend.result }} | Check artifacts |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests (Frontend) | ${{ needs.unit-tests-frontend.result }} | Check artifacts |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| API Tests | ${{ needs.api-tests.result }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Database Tests | ${{ needs.database-tests.result }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Tests | ${{ needs.security-tests.result }} | - |" >> $GITHUB_STEP_SUMMARY
          
          # Check if any tests failed
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ Some tests failed. Please check the individual test results."
            exit 1
          else
            echo "✅ All tests passed successfully!"
          fi