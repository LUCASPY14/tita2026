# ============================================================================
# CI/CD Pipeline - Sistema Cantina Tita
# Unified workflow consolidating all testing, quality checks, and deployments
# ============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [desarrollo, staging, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'temp_logs/**'
  
  pull_request:
    branches: [desarrollo, staging, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - development
          - staging
          - production
      run_e2e:
        description: 'Run E2E tests'
        required: false
        type: boolean
        default: true

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

# Cancel in-progress runs for the same workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # SECURITY SCANNING
  # ============================================================================
  security-scan:
    name: 🔐 Security Scan
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

  # ============================================================================
  # BACKEND PIPELINE
  # ============================================================================
  backend-tests:
    name: 🐍 Backend Tests
    runs-on: ubuntu-latest
    
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: Test_StrongPassw0rd!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "bash -c 'echo > /dev/tcp/localhost/1433'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=10s
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Install ODBC driver for SQL Server
        run: |
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft.gpg] https://packages.microsoft.com/ubuntu/$(lsb_release -rs)/prod $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Check for missing migrations
        env:
          DJANGO_SETTINGS_MODULE: backend.settings.test
          SECRET_KEY: test-secret-key-for-ci-${{ github.run_id }}
          DEBUG: 'True'
          DB_HOST: 127.0.0.1
          DB_PORT: '1433'
          DB_NAME: titadb
          DB_USER: sa
          DB_PASSWORD: Test_StrongPassw0rd!
        run: |
          cd backend
          python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        env:
          DJANGO_SETTINGS_MODULE: backend.settings.test
          SECRET_KEY: test-secret-key-for-ci-${{ github.run_id }}
          DEBUG: 'True'
          DB_HOST: 127.0.0.1
          DB_PORT: '1433'
          DB_NAME: titadb
          DB_USER: sa
          DB_PASSWORD: Test_StrongPassw0rd!
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
        run: |
          cd backend
          python -m pytest apps/ tests/ \
            --cov=apps \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --junit-xml=junit.xml \
            --tb=short \
            --maxfail=10 \
            -v
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: |
            backend/htmlcov/
            backend/junit.xml
            backend/coverage.xml
          retention-days: 7

  backend-quality:
    name: 🔍 Backend Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 isort bandit safety
      
      - name: Check code formatting (Black)
        run: |
          cd backend
          black --check apps/ backend/ || (echo "❌ Run: black apps/ backend/" && exit 1)
      
      - name: Check import sorting (isort)
        run: |
          cd backend
          isort --check-only --settings-path . apps/ backend/ || (echo "❌ Run: isort --settings-path . apps/ backend/" && exit 1)
      
      - name: Lint with Flake8
        run: |
          cd backend
          flake8 apps/ backend/ \
            --max-line-length=120 \
            --extend-ignore=E203,E266,E501,W503 \
            --exclude=migrations,__pycache__,node_modules,.venv \
            --statistics
      
      - name: Security scan (Bandit)
        run: |
          cd backend
          bandit -r apps/ -ll -f json -o bandit-report.json || true
      
      - name: Dependency security check (Safety)
        run: |
          cd backend
          pip install -r requirements.txt
          safety check --json --output safety-report.json || echo "⚠️ Vulnerabilities found"
      
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-security-reports
          path: |
            backend/bandit-report.json
            backend/safety-report.json
          retention-days: 30

  # ============================================================================
  # FRONTEND PIPELINE
  # ============================================================================
  frontend-tests:
    name: ⚛️ Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package.json
      
      - name: Install dependencies
        run: |
          cd frontend
          npm install --prefer-offline
      
      - name: Run tests with coverage
        run: |
          cd frontend
          npm run test:coverage
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./frontend/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-results
          path: frontend/coverage/
          retention-days: 7

  frontend-quality:
    name: 🎨 Frontend Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package.json
      
      - name: Install dependencies
        run: |
          cd frontend
          npm install --prefer-offline
      
      - name: Type check (TypeScript)
        run: |
          cd frontend
          npx tsc --noEmit || (echo "❌ TypeScript errors found" && exit 1)
      
      - name: Lint (ESLint)
        run: |
          cd frontend
          npm run lint || (echo "❌ ESLint errors found" && exit 1)
      
      - name: Security audit
        run: |
          cd frontend
          npm audit --audit-level=moderate || echo "⚠️ Vulnerabilities found"

  # ============================================================================
  # MOBILE PIPELINE
  # ============================================================================
  mobile-tests:
    name: 📱 Mobile Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mobile/package.json
      
      - name: Install dependencies
        run: |
          cd mobile
          npm install --prefer-offline
      
      - name: Run tests
        run: |
          cd mobile
          npm test -- --coverage --watchAll=false
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-test-results
          path: mobile/coverage/
          retention-days: 7

  # ============================================================================
  # BUILD ARTIFACTS
  # ============================================================================
  build-backend:
    name: 🔨 Build Backend
    runs-on: ubuntu-latest
    needs: [backend-tests, backend-quality]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Collect static files
        env:
          DJANGO_SETTINGS_MODULE: backend.settings.base
          SECRET_KEY: build-secret-key-${{ github.run_id }}
          DEBUG: 'False'
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: |
          cd backend
          python manage.py collectstatic --noinput
      
      - name: Build Docker image (if Dockerfile exists)
        if: hashFiles('docker/backend/Dockerfile') != ''
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }} \
            -f docker/backend/Dockerfile \
            ./backend
      
      - name: Upload static files
        uses: actions/upload-artifact@v4
        with:
          name: backend-static
          path: backend/staticfiles/
          retention-days: 7

  build-frontend:
    name: 🎨 Build Frontend
    runs-on: ubuntu-latest
    needs: [frontend-tests, frontend-quality]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package.json
      
      - name: Install dependencies
        run: |
          cd frontend
          npm install --prefer-offline
      
      - name: Build production bundle
        env:
          CI: 'false'
          REACT_APP_API_URL: ${{ secrets.API_URL || 'http://localhost:8000' }}
        run: |
          cd frontend
          npm run build
      
      - name: Analyze bundle size
        run: |
          cd frontend
          echo "📦 Bundle Size Report"
          du -sh build/
          echo ""
          echo "JavaScript bundles:"
          find build/static/js -name "*.js" -not -name "*.map" -exec du -h {} \; | sort -h
      
      - name: Build Docker image (if Dockerfile exists)
        if: hashFiles('docker/frontend/Dockerfile') != ''
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }} \
            -f docker/frontend/Dockerfile \
            ./frontend
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 7

  # ============================================================================
  # END-TO-END TESTS
  # ============================================================================
  e2e-tests:
    name: 🧪 E2E Tests (Cypress)
    runs-on: ubuntu-latest
    needs: [build-frontend]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_e2e) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e'))
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package.json
      
      - name: Install dependencies
        run: |
          cd frontend
          npm install --prefer-offline
      
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
      
      - name: Run Cypress E2E tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          start: npm start
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 120
          browser: chrome
          record: false
      
      - name: Upload Cypress screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
          retention-days: 7
      
      - name: Upload Cypress videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: frontend/cypress/videos
          retention-days: 7

  # ============================================================================
  # DEPLOYMENT - STAGING
  # ============================================================================
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, mobile-tests]
    if: |
      github.event_name == 'push' && 
      github.ref == 'refs/heads/desarrollo' &&
      github.repository == 'LUCASPY14/tita2026'
    environment:
      name: staging
      url: https://staging.cantinatita.com
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-static
          path: backend/staticfiles
      
      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
      
      - name: Configure AWS credentials
        if: env.AWS_ACCESS_KEY_ID != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION || 'us-east-1' }}
      
      - name: Deploy to staging (Docker Compose)
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          script: |
            cd /var/www/cantina-tita
            git pull origin desarrollo
            docker-compose -f docker-compose.prod.yml pull
            docker-compose -f docker-compose.prod.yml up -d --build
            docker-compose -f docker-compose.prod.yml exec -T backend python manage.py migrate --noinput
            docker-compose -f docker-compose.prod.yml exec -T backend python manage.py collectstatic --noinput
            echo "✅ Staging deployment completed"
      
      - name: Notify deployment success
        if: success()
        run: |
          echo "🎉 Successfully deployed to staging environment"
          echo "URL: https://staging.cantinatita.com"
      
      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ Staging deployment failed"
          exit 1

  # ============================================================================
  # DEPLOYMENT - PRODUCTION
  # ============================================================================
  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, mobile-tests, e2e-tests]
    if: |
      github.event_name == 'push' && 
      github.ref == 'refs/heads/main' &&
      github.repository == 'LUCASPY14/tita2026'
    environment:
      name: production
      url: https://cantinatita.com
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-static
          path: backend/staticfiles
      
      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
      
      - name: Configure AWS credentials
        if: env.AWS_ACCESS_KEY_ID != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION || 'us-east-1' }}
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            frontend/build/**
            backend/staticfiles/**
          generate_release_notes: true
      
      - name: Deploy to production (Docker Compose)
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          script: |
            cd /var/www/cantina-tita
            git pull origin main
            docker-compose -f docker-compose.prod.yml pull
            docker-compose -f docker-compose.prod.yml up -d --build
            docker-compose -f docker-compose.prod.yml exec -T backend python manage.py migrate --noinput
            docker-compose -f docker-compose.prod.yml exec -T backend python manage.py collectstatic --noinput
            # Create backup
            docker-compose -f docker-compose.prod.yml exec -T db sh -c '/opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -Q "BACKUP DATABASE [titadb] TO DISK = '\''/var/opt/mssql/backup_titadb.bak'\'' WITH INIT, COMPRESSION" -C'
            echo "✅ Production deployment completed"
      
      - name: Health check
        continue-on-error: true
        run: |
          echo "Waiting for application to start..."
          sleep 30
          
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.PROD_URL }}/health/)
          if [ "$RESPONSE" == "200" ]; then
            echo "✅ Health check passed"
          else
            echo "❌ Health check failed with status $RESPONSE"
            exit 1
          fi
      
      - name: Notify deployment success
        if: success()
        run: |
          echo "🎉 Successfully deployed to production"
          echo "URL: https://cantinatita.com"
      
      - name: Rollback on failure
        if: failure()
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /var/www/cantina-tita
            git reset --hard HEAD~1
            docker-compose -f docker-compose.prod.yml up -d
            echo "🔄 Rollback completed"

  # ============================================================================
  # CI/CD SUMMARY
  # ============================================================================
  summary:
    name: 📊 CI/CD Summary
    runs-on: ubuntu-latest
    needs: 
      - security-scan
      - backend-tests
      - backend-quality
      - frontend-tests
      - frontend-quality
      - mobile-tests
      - build-backend
      - build-frontend
    if: always()
    
    steps:
      - name: Check job statuses
        run: |
          echo "# 📊 CI/CD Pipeline Summary"
          echo ""
          echo "## Test Results"
          echo "- 🐍 Backend Tests: ${{ needs.backend-tests.result }}"
          echo "- ⚛️  Frontend Tests: ${{ needs.frontend-tests.result }}"
          echo "- 📱 Mobile Tests: ${{ needs.mobile-tests.result }}"
          echo ""
          echo "## Quality Checks"
          echo "- 🔍 Backend Quality: ${{ needs.backend-quality.result }}"
          echo "- 🎨 Frontend Quality: ${{ needs.frontend-quality.result }}"
          echo "- 🔐 Security Scan: ${{ needs.security-scan.result }}"
          echo ""
          echo "## Build Status"
          echo "- 🔨 Backend Build: ${{ needs.build-backend.result }}"
          echo "- 🎨 Frontend Build: ${{ needs.build-frontend.result }}"
          echo ""
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
      
      - name: Fail if any critical job failed
        if: |
          needs.backend-tests.result == 'failure' ||
          needs.frontend-tests.result == 'failure' ||
          needs.mobile-tests.result == 'failure' ||
          needs.build-backend.result == 'failure' ||
          needs.build-frontend.result == 'failure'
        run: |
          echo "❌ One or more critical jobs failed"
          exit 1
      
      - name: Success message
        if: success()
        run: |
          echo "✅ All CI/CD checks passed successfully!"
