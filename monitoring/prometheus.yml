global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    app: cantina-tita

scrape_configs:
  - job_name: django
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics
    scrape_interval: 30s

  - job_name: redis
    static_configs:
      - targets: ["redis:6379"]
    scrape_interval: 30s

  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
    scrape_interval: 30s
