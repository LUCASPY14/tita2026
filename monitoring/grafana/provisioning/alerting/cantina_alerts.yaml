apiVersion: 1

# ─── Punto de contacto: email al equipo administrador ─────────────────────────
contactPoints:
  - orgId: 1
    name: email-admins
    receivers:
      - uid: cantina-email-receiver
        type: email
        settings:
          addresses: admin@cantinatita.com
          singleEmail: false

# ─── Política de notificaciones ───────────────────────────────────────────────
policies:
  - orgId: 1
    receiver: email-admins
    group_by: [alertname, severity]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: email-admins
        matchers:
          - severity = critical
        repeat_interval: 1h

# ─── Reglas de alerta ─────────────────────────────────────────────────────────
groups:
  - orgId: 1
    name: Cantina Tita — Producción
    folder: Alertas
    interval: 1m
    rules:

      # ── 1. Tasa de errores HTTP 5xx > 5% ───────────────────────────────────
      - uid: cantina-alert-5xx
        title: Tasa de errores 5xx alta
        condition: umbral
        data:
          - refId: tasa_errores
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: >
                sum(rate(django_http_responses_total_by_status_total{status=~"5.."}[5m]))
                /
                sum(rate(django_http_responses_total_by_status_total[5m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: tasa_errores
          - refId: umbral
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              refId: umbral
              expression: tasa_errores
              conditions:
                - evaluator:
                    type: gt
                    params: [0.05]
                  operator:
                    type: and
                  query:
                    params: [tasa_errores]
                  reducer:
                    type: last
                  type: query
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Errores HTTP 5xx superaron el 5% sostenido durante 5 minutos.
          description: >
            La tasa de respuestas 5xx supera el 5% del total de requests.
            Revisar logs: docker compose logs --tail=100 backend

      # ── 2. Latencia p95 > 1000 ms ──────────────────────────────────────────
      - uid: cantina-alert-latencia
        title: Latencia p95 alta (> 1 s)
        condition: umbral
        data:
          - refId: latencia_p95
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: >
                histogram_quantile(0.95,
                  sum(rate(django_http_requests_latency_seconds_by_view_method_bucket[5m]))
                  by (le)
                ) * 1000
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: latencia_p95
          - refId: umbral
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              refId: umbral
              expression: latencia_p95
              conditions:
                - evaluator:
                    type: gt
                    params: [1000]
                  operator:
                    type: and
                  query:
                    params: [latencia_p95]
                  reducer:
                    type: last
                  type: query
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Latencia p95 de la API supera 1 segundo durante 5 minutos.
          description: >
            El percentil 95 de latencia de requests HTTP supera los 1000 ms.
            Verificar carga en DB y workers Celery.

      # ── 3. Tareas críticas de Celery fallidas ──────────────────────────────
      - uid: cantina-alert-celery
        title: Fallo en tarea crítica de Celery
        condition: umbral
        data:
          - refId: fallos_celery
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: increase(celery_task_failures_total[5m])
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: fallos_celery
          - refId: umbral
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              refId: umbral
              expression: fallos_celery
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [fallos_celery]
                  reducer:
                    type: last
                  type: query
        noDataState: NoData
        execErrState: Alerting
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Una o más tareas de Celery fallaron en los últimos 5 minutos.
          description: >
            Verificar especialmente: cerrar_cuentas_mes_anterior,
            generar_cuentas_mensuales, generar_resumen_diario_ventas,
            generar_resumen_diario_stock.
            Revisar: docker compose logs --tail=100 celery

      # ── 4. Redis — memoria > 80% del límite configurado ───────────────────
      - uid: cantina-alert-redis-memory
        title: Redis memoria alta (> 80%)
        condition: umbral
        data:
          - refId: redis_mem_ratio
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: >
                redis_memory_used_bytes / redis_memory_max_bytes
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: redis_mem_ratio
          - refId: umbral
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              refId: umbral
              expression: redis_mem_ratio
              conditions:
                - evaluator:
                    type: gt
                    params: [0.8]
                  operator:
                    type: and
                  query:
                    params: [redis_mem_ratio]
                  reducer:
                    type: last
                  type: query
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Redis está usando más del 80% de su memoria máxima configurada.
          description: >
            Revisar maxmemory en redis.conf o aumentar la memoria disponible para el contenedor.
            Si redis_memory_max_bytes es 0 (sin límite), esta alerta no se disparará —
            configurar maxmemory en el comando del servicio redis.

      # ── 5. Host Windows — disco C: > 85% ──────────────────────────────────
      - uid: cantina-alert-disco-host
        title: Disco C del servidor casi lleno (> 85%)
        condition: umbral
        data:
          - refId: disco_uso
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: >
                (windows_logical_disk_size_bytes{volume="C:"}
                - windows_logical_disk_free_bytes{volume="C:"})
                / windows_logical_disk_size_bytes{volume="C:"} * 100
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: disco_uso
          - refId: umbral
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              refId: umbral
              expression: disco_uso
              conditions:
                - evaluator:
                    type: gt
                    params: [85]
                  operator:
                    type: and
                  query:
                    params: [disco_uso]
                  reducer:
                    type: last
                  type: query
        noDataState: NoData
        execErrState: Alerting
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: El disco C del servidor supera el 85% de uso.
          description: >
            Liberar espacio o ampliar el disco antes de que se llene.
            Verificar backups en C:\backups\cantina\ y logs de Docker.
            Requiere windows_exporter instalado como servicio en el host (puerto 9182).

      # ── 6. Host Windows — RAM > 90% ────────────────────────────────────────
      - uid: cantina-alert-ram-host
        title: RAM del servidor alta (> 90%)
        condition: umbral
        data:
          - refId: ram_uso
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: >
                (windows_os_visible_memory_bytes - windows_os_physical_memory_free_bytes)
                / windows_os_visible_memory_bytes * 100
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: ram_uso
          - refId: umbral
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              refId: umbral
              expression: ram_uso
              conditions:
                - evaluator:
                    type: gt
                    params: [90]
                  operator:
                    type: and
                  query:
                    params: [ram_uso]
                  reducer:
                    type: last
                  type: query
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: La RAM del servidor supera el 90% de uso sostenido.
          description: >
            Revisar procesos con mayor consumo de memoria en el servidor Windows.
            Considerar reiniciar servicios no esenciales o ampliar la RAM.
            Requiere windows_exporter instalado como servicio en el host (puerto 9182).
